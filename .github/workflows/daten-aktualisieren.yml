name: Daten aktualisieren
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Daten holen
        run: python3 collector/fetch_data.py
      - name: Ergebnis einchecken
        run: |
          git config user.name  "Aktien-Tool Bot"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet || git commit -m "Daten vom $(date +%F)"
          git push
